name: Versão Windows

# Gera o instalador .exe (NSIS) e publica num Release do GitHub.
# Dispara ao criar uma tag de versão (ex.: git tag v0.2.0 && git push --tags) ou pelo botão "Run workflow".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Cartas v__VERSION__
          releaseBody: |
            **Instalação no Windows:** baixe o arquivo `Cartas_…_x64-setup.exe` abaixo e execute.

            - Se o Cartas já estiver instalado, o instalador só atualiza o app e mantém seus dados (base de cartas e imagens em cache).
            - O instalador não pede administrador: instala na sua conta de usuário.
            - O app não tem assinatura digital, então o Windows pode mostrar "O Windows protegeu o computador". Clique em **Mais informações** → **Executar assim mesmo**.
            - Se faltar o WebView2 (Windows antigos), o instalador baixa sozinho.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

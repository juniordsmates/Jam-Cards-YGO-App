name: Versão (Windows e macOS)

# Gera o instalador do Windows (.exe, NSIS) e o do macOS (.dmg universal: Apple Silicon e Intel)
# e publica os dois no mesmo Release do GitHub.
# Só o branch de distribuição "release" gera instalador. Ele só recebe mudanças da main quando o
# dono do projeto pede. O número da versão vem de package.json/tauri.conf.json/Cargo.toml (os três
# iguais); o canal (Alpha, Beta…) vem de CANAL abaixo.
on:
  push:
    branches: [release]
  workflow_dispatch:

env:
  CANAL: alpha # minúsculas; vira sufixo da tag (v1.0.0-alpha) e nome do release (Jam Cards - YGO! v1.0.0 alpha)

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Número da versão (package.json)
        id: versao
        shell: bash
        run: echo "versao=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__-${{ env.CANAL }}
          releaseName: "Jam Cards - YGO! v__VERSION__ ${{ env.CANAL }}"
          releaseCommitish: ${{ github.ref_name }}
          releaseBody: |
            **Windows:** baixe o arquivo `…_x64-setup.exe` e execute.
            - Se o Jam Cards - YGO! já estiver instalado, o instalador só atualiza o app e mantém seus dados (base de cartas e imagens em cache).
            - Não pede administrador: instala na sua conta de usuário. Se faltar o WebView2 (Windows antigos), o instalador baixa sozinho.
            - O app não tem assinatura digital: se aparecer "O Windows protegeu o computador", clique em **Mais informações** → **Executar assim mesmo**.

            **macOS (Apple Silicon e Intel):** baixe o arquivo `…_universal.dmg`, abra e arraste o Jam Cards - YGO! para **Aplicativos**.
            - O app não é assinado pela Apple. Na primeira vez, se o macOS bloquear, vá em **Ajustes do Sistema → Privacidade e Segurança** e clique em **Abrir Mesmo Assim**.
            - Se aparecer "está danificado", rode no Terminal: `xattr -cr '/Applications/Jam Cards - YGO!.app'` e abra de novo.
          releaseDraft: false
          prerelease: true
          args: --bundles nsis

  macos:
    # máquina Intel: as macOS ARM do GitHub ficaram sem capacidade (jobs descartados na fila em nov/2026).
    # O .dmg continua universal (Apple Silicon e Intel): o Rust compila os dois alvos daqui.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__-${{ env.CANAL }}
          releaseName: "Jam Cards - YGO! v__VERSION__ ${{ env.CANAL }}"
          releaseCommitish: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: true
          args: --target universal-apple-darwin --bundles dmg

  # Site (versão web do app) no GitHub Pages do repositório público Jam-Cards-YGO (branch gh-pages):
  # https://juniordsmates.github.io/Jam-Cards-YGO/ — publica só depois que a chave SITE_DEPLOY_KEY
  # (deploy key com escrita no Jam-Cards-YGO) for cadastrada nos segredos deste repositório
  site:
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE_SITE: ${{ secrets.SITE_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Montar o site
        run: npm run build
        env:
          SITE_BASE: /Jam-Cards-YGO/
      - name: Publicar no GitHub Pages
        if: env.TEM_CHAVE_SITE == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: juniordsmates/Jam-Cards-YGO
          publish_branch: gh-pages
          publish_dir: dist
          commit_message: "Site da versão web (${{ github.sha }})"

  # Copia os instaladores do Release para Install/<versão>/ na main, para achar tudo pela página do projeto
  pasta-install:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tag da versão no commit desta build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # o Release é reaproveitado entre builds da mesma versão; a tag acompanha a build mais recente
        run: gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/v${{ needs.windows.outputs.versao }}-${CANAL}" -f sha="${{ github.sha }}" -F force=true
      - name: Atualizar Install/${{ needs.windows.outputs.versao }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSAO: ${{ needs.windows.outputs.versao }}
        run: |
          TAG="v${VERSAO}-${CANAL}"
          mkdir -p "Install/$VERSAO"
          rm -f "Install/$VERSAO"/*.exe "Install/$VERSAO"/*.dmg
          gh release download "$TAG" --dir "Install/$VERSAO" --pattern '*.exe' --pattern '*.dmg'
          node scripts/install-readme.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Install
          git diff --cached --quiet && exit 0
          git commit -m "Instaladores da versão $VERSAO"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1
